name: Final Three App Audit

on:
  push:
    branches:
      - fix/final-three-app-audit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/final-three-app-audit.test.mjs tests/practice-review-gate.test.mjs
