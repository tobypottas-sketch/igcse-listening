name: Practice Review Gate

on:
  push:
    branches:
      - fix/practice-review-gate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/practice-review-gate.test.mjs
